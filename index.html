<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Game - Classroom Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            margin: 0;
            overflow: hidden; /* Prevent scrolling on the main wrapper */
        }
        .font-fredoka { font-family: 'Fredoka One', cursive; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        .screen { display: none; }
        .screen.active { display: flex; }
        
        /* Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #EF4444;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen w-screen text-gray-800">

    <!-- MAIN APP CONTAINER (Kahoot-style Lobby System) -->
    <div id="app-container" class="w-full h-full flex flex-col items-center justify-center p-4">
        
        <!-- Loading Screen (Initial Auth) -->
        <div id="screen-loading" class="screen active flex-col items-center gap-4">
            <div class="loader"></div>
            <p class="font-bold text-gray-600">Connecting to server...</p>
        </div>

        <!-- 1. Home / Role Selection Screen -->
        <div id="screen-home" class="screen flex-col items-center gap-6 max-w-md w-full">
            <div class="text-center mb-4 animate-bounce">
                <div class="text-6xl mb-2">🇮🇹</div>
                <h1 class="text-4xl font-fredoka text-red-500 drop-shadow-sm">Make a Pizza</h1>
            </div>
            
            <button onclick="showTeacherDashboard()" class="w-full py-4 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-fredoka text-xl rounded-2xl shadow-xl transition transform hover:scale-105 flex items-center justify-center gap-3">
                <i class="fa-solid fa-chalkboard-user"></i>
                Teacher Host
            </button>

            <button onclick="showStudentJoin()" class="w-full py-4 bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white font-fredoka text-xl rounded-2xl shadow-xl transition transform hover:scale-105 flex items-center justify-center gap-3">
                <i class="fa-solid fa-user-graduate"></i>
                Student Join
            </button>
        </div>

        <!-- 2. Teacher Dashboard -->
        <div id="screen-teacher-lobby" class="screen flex-col items-center w-full max-w-4xl h-full py-8">
            <div class="glass-panel w-full rounded-3xl p-6 shadow-2xl flex flex-col h-full">
                
                <div class="flex justify-between items-center border-b-2 border-gray-200 pb-4 mb-4">
                    <h2 class="text-2xl font-fredoka text-blue-600 flex items-center gap-2">
                        <i class="fa-solid fa-chalkboard"></i> Teacher Dashboard
                    </h2>
                    <button onclick="location.reload()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-xl font-bold text-gray-700 text-sm">
                        End Game
                    </button>
                </div>

                <div class="text-center mb-8">
                    <p class="text-gray-500 font-bold uppercase tracking-wider mb-2">Join at <span class="text-blue-500">this device</span> with PIN:</p>
                    <div id="room-pin-display" class="text-7xl md:text-9xl font-fredoka text-gray-900 tracking-widest drop-shadow-md">
                        ----
                    </div>
                </div>

                <div class="flex justify-between items-center mb-4 px-2">
                    <h3 class="text-xl font-bold text-gray-700">Students Joined: <span id="student-count" class="text-blue-500">0</span></h3>
                    <button id="btn-start-game" onclick="startGame()" disabled class="px-8 py-3 bg-red-500 disabled:opacity-50 text-white font-fredoka text-xl rounded-xl shadow-lg hover:bg-red-600 transition flex items-center gap-2">
                        Start Game <i class="fa-solid fa-play"></i>
                    </button>
                </div>

                <!-- Grid of student names -->
                <div id="student-grid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 p-2 bg-white/50 rounded-2xl border-2 border-dashed border-gray-300 items-start content-start">
                    <!-- Students will appear here -->
                    <div class="col-span-full text-center text-gray-400 font-bold mt-10" id="waiting-for-students-msg">
                        Waiting for students to join...
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. Student Join Screen -->
        <div id="screen-student-join" class="screen flex-col items-center justify-center w-full max-w-sm gap-4">
            <div class="glass-panel w-full rounded-3xl p-8 shadow-2xl flex flex-col gap-5">
                <div class="text-center mb-2">
                    <h2 class="text-3xl font-fredoka text-green-500">Join Game</h2>
                </div>
                
                <div id="join-error-msg" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-xl text-sm font-bold text-center">
                    Error message goes here
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Room PIN</label>
                    <input type="number" id="input-pin" class="w-full text-center text-3xl font-fredoka px-4 py-3 rounded-xl border-2 border-gray-300 focus:border-green-500 focus:outline-none" placeholder="1234" maxlength="4">
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2 uppercase tracking-wide">Nickname</label>
                    <input type="text" id="input-name" class="w-full text-center text-xl font-bold px-4 py-3 rounded-xl border-2 border-gray-300 focus:border-green-500 focus:outline-none" placeholder="Your Name" maxlength="15">
                </div>

                <button onclick="submitStudentJoin()" id="btn-submit-join" class="w-full mt-4 py-4 bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white font-fredoka text-xl rounded-xl shadow-lg transition">
                    Enter
                </button>
                <button onclick="switchScreen('screen-home')" class="w-full py-2 text-gray-500 font-bold hover:text-gray-700">
                    Back
                </button>
            </div>
        </div>

        <!-- 4. Student Waiting Lobby -->
        <div id="screen-student-lobby" class="screen flex-col items-center justify-center w-full gap-6">
            <div class="glass-panel rounded-3xl p-10 shadow-2xl flex flex-col items-center text-center gap-6 max-w-md w-full">
                <div class="text-5xl animate-bounce">👋</div>
                <div>
                    <h2 class="text-3xl font-fredoka text-gray-800 mb-2">You're in, <span id="display-student-name" class="text-green-500">Player</span>!</h2>
                    <p class="text-lg font-bold text-gray-500">See your name on the board?</p>
                </div>
                <div class="loader my-4"></div>
                <p class="text-md font-bold text-gray-600 bg-white/50 px-4 py-2 rounded-lg w-full">Waiting for teacher to start...</p>
            </div>
        </div>

    </div>

    <!-- ACTUAL GAME CONTAINER (Hidden until game starts) -->
    <div id="game-container" style="display:none;" class="w-full h-full absolute inset-0 bg-white z-50">
        <!-- 
            We embed the user's existing make_a_pizza.html file verbatim via an iframe.
            This perfectly preserves their code, styling, and game mechanics without interference. 
        -->
        <iframe src="make_a_pizza.html" class="w-full h-full border-none outline-none"></iframe>
    </div>


    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables
        window.db = null;
        window.auth = null;
        window.userId = null;
        window.currentRoomPin = null;
        window.isTeacher = false;
        
        // Environment variables setup for the coding sandbox
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pizza-kahoot-default-app';
        let firebaseConfig = {};
        
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            } else {
                // Fallback config from user's original request if sandbox env isn't present
                firebaseConfig = {
                    apiKey: "AIzaSyB065lA9ReBs-12BxM-nW2flmaRip4otTQ",
                    authDomain: "english-activities-cbd28.firebaseapp.com",
                    projectId: "english-activities-cbd28",
                    storageBucket: "english-activities-cbd28.firebasestorage.app",
                    messagingSenderId: "895610924951",
                    appId: "1:895610924951:web:29f78d9b3ac5973eddded2"
                };
            }
        } catch (e) {
            console.error("Config parsing error", e);
        }

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        window.db = db;
        window.auth = auth;

        // Path generator complying with mandatory rules
        const getRoomRef = (pin) => doc(db, 'artifacts', appId, 'public', 'data', 'rooms', pin.toString());

        // Authenticate User
        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                window.userId = auth.currentUser.uid;
                
                // Auto-detect role from URL if present (e.g., ?role=teacher)
                const urlParams = new URLSearchParams(window.location.search);
                const role = urlParams.get('role');
                
                if (role === 'teacher') {
                    showTeacherDashboard();
                } else if (role === 'student') {
                    showStudentJoin();
                } else {
                    switchScreen('screen-home');
                }
                
            } catch (error) {
                console.error("Auth error:", error);
                alert("Failed to connect to game servers.");
            }
        }

        // Run init on load
        initApp();

        // UI Control Functions
        window.switchScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showError(msg) {
            const errorDiv = document.getElementById('join-error-msg');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 4000);
        }

        // --- TEACHER LOGIC ---
        window.showTeacherDashboard = async function() {
            window.isTeacher = true;
            switchScreen('screen-loading');
            
            // Generate a random 4-digit PIN
            const pin = Math.floor(1000 + Math.random() * 9000).toString();
            window.currentRoomPin = pin;
            
            const roomRef = getRoomRef(pin);
            
            try {
                // Create room document
                await setDoc(roomRef, {
                    status: 'waiting',
                    players: [],
                    hostId: window.userId,
                    createdAt: serverTimestamp()
                });
                
                document.getElementById('room-pin-display').innerText = pin;
                switchScreen('screen-teacher-lobby');
                
                // Listen for students joining real-time
                onSnapshot(roomRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        updateTeacherLobby(data.players || []);
                    }
                }, (error) => {
                    console.error("Snapshot error:", error);
                });
                
            } catch (error) {
                console.error("Error creating room:", error);
                switchScreen('screen-home');
                alert("Could not create room.");
            }
        };

        function updateTeacherLobby(players) {
            const grid = document.getElementById('student-grid');
            const countDisplay = document.getElementById('student-count');
            const startBtn = document.getElementById('btn-start-game');
            const waitingMsg = document.getElementById('waiting-for-students-msg');
            
            countDisplay.innerText = players.length;
            
            if (players.length > 0) {
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50');
                if(waitingMsg) waitingMsg.style.display = 'none';
            } else {
                startBtn.disabled = true;
                startBtn.classList.add('opacity-50');
                if(waitingMsg) waitingMsg.style.display = 'block';
            }
            
            // Keep the waiting message if grid is empty, otherwise clear and add names
            const namesHtml = players.map(p => `
                <div class="bg-white px-4 py-3 rounded-xl shadow-sm border border-gray-200 text-center font-bold text-gray-800 text-lg animate-[bounce-subtle_0.3s_ease-out]">
                    ${p.name}
                </div>
            `).join('');
            
            grid.innerHTML = players.length === 0 ? '<div class="col-span-full text-center text-gray-400 font-bold mt-10" id="waiting-for-students-msg">Waiting for students to join...</div>' : namesHtml;
        }

        window.startGame = async function() {
            if (!window.currentRoomPin) return;
            
            const startBtn = document.getElementById('btn-start-game');
            startBtn.disabled = true;
            startBtn.innerText = "Starting...";
            
            try {
                // Update Firebase status to 'active' which will trigger students
                await updateDoc(getRoomRef(window.currentRoomPin), {
                    status: 'active'
                });
                // The teacher can either watch the dashboard or also play. 
                // We'll leave the dashboard up so the teacher can monitor, or we could redirect to game.
                startBtn.innerText = "Game is Active!";
                startBtn.classList.replace('bg-red-500', 'bg-green-500');
            } catch(e) {
                console.error("Error starting game", e);
                startBtn.disabled = false;
                startBtn.innerText = "Start Game";
            }
        };

        // --- STUDENT LOGIC ---
        window.showStudentJoin = function() {
            window.isTeacher = false;
            switchScreen('screen-student-join');
        };

        window.submitStudentJoin = async function() {
            const pin = document.getElementById('input-pin').value.trim();
            const name = document.getElementById('input-name').value.trim();
            const btn = document.getElementById('btn-submit-join');
            
            if (pin.length !== 4) return showError("Please enter a 4-digit PIN.");
            if (name.length < 1) return showError("Please enter your nickname.");
            
            btn.disabled = true;
            btn.innerText = "Joining...";
            
            try {
                const roomRef = getRoomRef(pin);
                const docSnap = await getDoc(roomRef);
                
                if (!docSnap.exists()) {
                    btn.disabled = false;
                    btn.innerText = "Enter";
                    return showError("Room not found. Check PIN.");
                }
                
                const roomData = docSnap.data();
                if (roomData.status !== 'waiting') {
                    btn.disabled = false;
                    btn.innerText = "Enter";
                    return showError("Game has already started.");
                }
                
                // Add student to the players array in Firestore
                await updateDoc(roomRef, {
                    players: arrayUnion({ id: window.userId, name: name })
                });
                
                // Show Lobby
                window.currentRoomPin = pin;
                document.getElementById('display-student-name').innerText = name;
                switchScreen('screen-student-lobby');
                
                // Listen to the room status
                onSnapshot(roomRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        if (data.status === 'active') {
                            launchGame();
                        }
                    } else {
                        // Room was deleted or closed
                        alert("The room was closed by the teacher.");
                        window.location.reload();
                    }
                }, (error) => {
                    console.error("Snapshot error:", error);
                });
                
            } catch (error) {
                console.error("Join error:", error);
                btn.disabled = false;
                btn.innerText = "Enter";
                showError("Error connecting to room.");
            }
        };

        // Launch Game Function
        function launchGame() {
            // Hide the Kahoot-style lobby wrapper completely
            document.getElementById('app-container').style.display = 'none';
            
            // Show the original game container (which contains the iframe to make_a_pizza.html)
            const gameContainer = document.getElementById('game-container');
            gameContainer.style.display = 'block';
        }

    </script>
</body>
</html>
